<!DOCTYPE html>
<html data-theme="light" lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="{{title}}">
<title>{{title}} | QpiAI Opt</title>
<link rel="icon" href="assets/icon1.ico" sizes="any">
<link rel="stylesheet" href="assets/site.css">
<link rel="alternate" type="text/markdown" href="{{markdown}}">
<link rel="describedby" href="llms.txt" type="text/plain">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('qpiai-docs-theme')||'light'}catch(e){}</script>
<script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},options:{ignoreHtmlClass:'tex2jax_ignore',processHtmlClass:'arithmatex'}};</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-chtml.js"></script>
</head>
<body data-page="{{slug}}">
<a class="skip-link" href="#content">Skip to content</a>
<header class="topbar">
<button class="icon-button mobile-only" id="nav-toggle" aria-expanded="false" aria-label="Open navigation">☰</button>
<a class="brand" href="index.html" aria-label="QpiAI Opt documentation home"><img class="brand-logo" src="assets/qpiai-opt.svg" alt="QpiAI Opt"></a>
<nav class="top-links" aria-label="Primary"><a href="getting-started.html">Getting started</a><a href="public-api.html">API</a><a href="contributing.html">Contributing</a></nav>
<div class="top-actions"><button class="search-trigger" id="search-trigger" type="button" aria-haspopup="dialog"><span>Search docs</span><kbd>Ctrl K</kbd></button><button class="icon-button" id="theme-toggle" type="button" aria-label="Toggle color theme">◐</button><a class="icon-button" href="https://github.com/qpiai/qpiai-opt" aria-label="QpiAI Opt source repository" rel="noreferrer">↗</a></div>
</header>
<div class="shell">
<aside class="sidebar" id="sidebar" aria-label="Documentation navigation"><div class="sidebar-inner">{{navigation}}</div></aside>
<main class="main" id="content"><div class="breadcrumbs"><a href="index.html">Docs</a><span aria-hidden="true">&gt;</span><span>{{category}}</span><span aria-hidden="true">&gt;</span><span>{{title}}</span></div><article class="doc-content">{{content}}</article><footer class="page-footer"><p><a href="automation.html">Automation guide</a> · QpiAI Opt {{version}}</p><div class="pager">{{pager}}</div></footer></main>
<aside class="toc" aria-label="On this page"><div class="toc-inner"><h2>On this page</h2>{{toc}}</div></aside>
</div>
<div class="search-backdrop" id="search-backdrop" hidden><div class="search-dialog" role="dialog" aria-modal="true" aria-label="Documentation search"><div class="search-box"><input id="search-input" type="search" autocomplete="off" placeholder="Search APIs, models, fields, limits, and errors"><button id="search-close" type="button">Esc</button></div><div class="search-results" id="search-results"></div></div></div>
<script src="assets/search-index.js"></script>
<script src="assets/site.js"></script>
</body>
</html>
