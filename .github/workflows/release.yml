name: Release through private GitLab

on:
  push:
    branches: [main]
    paths: [pyproject.toml]

permissions:
  contents: read

jobs:
  trigger:
    if: github.repository == 'qpiai/qpiai-opt'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Trigger only when the SDK version changes
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_SHA: ${{ github.sha }}
          PREVIOUS_SHA: ${{ github.event.before }}
          SDK_REPOSITORY: ${{ github.repository }}
          GITLAB_TRIGGER_TOKEN: ${{ secrets.GITLAB_TRIGGER_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import tomllib
          import urllib.parse
          import urllib.request

          def version(sha):
              url = f"https://api.github.com/repos/{os.environ['SDK_REPOSITORY']}/contents/pyproject.toml?ref={sha}"
              request = urllib.request.Request(url, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github.raw+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  return tomllib.loads(response.read().decode())['project']['version']

          sha = os.environ['SDK_SHA']
          if not re.fullmatch('[0-9a-f]{40}', sha):
              raise SystemExit('Invalid SDK commit')
          current = version(sha)
          previous = os.environ['PREVIOUS_SHA']
          if previous != '0' * 40 and current == version(previous):
              print('SDK version unchanged; no release requested.')
          else:
              token = os.environ['GITLAB_TRIGGER_TOKEN']
              if not token:
                  raise SystemExit('Configure the GITLAB_TRIGGER_TOKEN repository secret')
              body = urllib.parse.urlencode({
                  'token': token, 'ref': 'main', 'inputs[sdk_sha]': sha,
              }).encode()
              request = urllib.request.Request(
                  'https://gitlab-test.qpiai.tech/api/v4/projects/725/trigger/pipeline',
                  data=body, method='POST',
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  pipeline = json.load(response)
              print('Private release pipeline:', pipeline['web_url'])
          PY
