[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qpiai-opt"
version = "0.0.9"
description = "Optimization modelling, interoperability, local solving, and QpiAI Platform SDK"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
authors = [{ name = "QpiAI" }]
requires-python = ">=3.10,<3.15"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.20.0",
    "highspy>=1.15.1",
    "pydantic>=2.0.0",
    "requests>=2.30.0",
    "scipy>=1.9.0",
]

[project.urls]
Homepage = "https://github.com/qpiai/qpiai-opt"
Documentation = "https://github.com/qpiai/qpiai-opt/blob/main/docs/index.md"
Issues = "https://github.com/qpiai/qpiai-opt/issues"
Source = "https://github.com/qpiai/qpiai-opt"

[project.optional-dependencies]
ommx = ["ommx>=2.6,<3"]
quantum = ["qpiai-quantum==0.3.0"]
all = ["ommx>=2.6,<3", "qpiai-quantum==0.3.0"]

[dependency-groups]
dev = [
    "build>=1.2.0",
    "pip-audit>=2.7.0",
    "pytest>=8.0.0",
    "ruff>=0.12.0",
    "setuptools>=83.0.0",
    "twine>=5.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["qpiai_opt*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
